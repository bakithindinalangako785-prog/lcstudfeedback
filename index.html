<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Feedback and Support System | Lemery Colleges</title>
<style>
:root{--bg:#e3e6f4;--card:#f1f2fa;--paper:#f6f7fc;--gold:#f2b232;--goldl:#fff3d1;--sage:#8d92d6;--sd:#2e3192;--sdd:#151457;--sl:#e8e9f6;--ink:#1f2140;--mut:#5f6280;--line:#c9cde8;--wa:#b86e00;--ok:#2f7d4f;--bad:#b3443f;--or:#ff9a00}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.layout{display:flex;min-height:100vh}
aside{width:260px;flex:none;background:var(--paper);border-right:1px solid var(--line);padding:1.3rem 1rem;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:.8rem;margin-bottom:1.3rem}
.lg{width:56px;height:56px;flex:none;object-fit:contain}
.lt b{display:block;font-size:1.15rem;line-height:1.2;color:var(--sdd)}.lt small{color:var(--mut);font-size:.75rem}
.lbl{font-size:.72rem;letter-spacing:.12em;font-weight:700;color:var(--mut);margin:.6rem .3rem .4rem}
nav{display:flex;flex-direction:column;gap:.3rem}
nav button{display:flex;align-items:center;gap:.9rem;background:transparent;border:1px solid transparent;border-left:4px solid transparent;border-radius:14px;padding:.8rem 1rem;font:inherit;font-weight:700;color:var(--sdd);cursor:pointer;text-align:left}
nav button i{font-style:normal;width:1.2rem;text-align:center;font-size:1.1rem}
nav button:hover{background:var(--bg)}
nav button.on{background:#dfe1f5;border-color:#c4c8ee;border-left-color:var(--sdd)}
.tip{margin-top:auto;background:var(--goldl);border-left:4px solid var(--gold);border-radius:14px;padding:1rem;font-size:.88rem;color:var(--mut)}
.tip b{color:var(--sdd)}
.content{flex:1;min-width:0}
main{max-width:1000px;margin:auto;padding:1.5rem 1.2rem 2rem}
.burger{display:none}
@media(max-width:800px){
.burger{display:block;position:fixed;top:.6rem;left:.6rem;z-index:20;background:var(--sdd);color:#fff;border:0;border-radius:10px;padding:.5rem .8rem;font-size:1.1rem;cursor:pointer}
aside{position:fixed;left:0;top:0;z-index:15;transform:translateX(-100%);transition:transform .2s;box-shadow:2px 0 14px rgba(0,0,0,.18)}
aside.open{transform:none}
main{padding-top:3.6rem}}
.card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:14px;padding:1.3rem;margin-bottom:1rem}

.hero.herobg .hello,.hero.herobg>p{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.55)}
.hero.herobg>img{background:#fff;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.narrow{max-width:480px;margin:1rem auto}
h1,h2,h3{margin:.1rem 0 .5rem;color:var(--sdd)}
.hero{background:var(--sl);text-align:center;padding:2rem 1rem}
.hero p{color:var(--mut);margin:.3rem auto 1rem;max-width:560px}
.quote{border-left:5px solid var(--or);background:var(--goldl);padding:1rem 1.2rem;border-radius:10px;font-size:1.1rem;font-style:italic;color:var(--sdd);text-align:left;max-width:600px;margin:1rem auto}
.btn{background:var(--sd);color:#fff;border:0;border-radius:10px;padding:.6rem 1.1rem;font:inherit;cursor:pointer}
.btn:hover{background:var(--sdd)}
.btn.ghost{background:var(--paper);color:var(--sd);border:1px solid var(--sage)}
.btn.ghost:hover{background:var(--sl)}
.btn.small{padding:.3rem .7rem;font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:.8rem}
.stack{display:flex;flex-direction:column;align-items:center;gap:.6rem;margin-top:.8rem}
label{display:block;margin:.7rem 0 .2rem;font-weight:600;font-size:.92rem}
input,select,textarea{width:100%;padding:.55rem .7rem;border:1px solid #b6bce2;border-radius:8px;font:inherit;background:#e8ebf8;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sage);border-color:var(--sage)}
input[type=radio],input[type=checkbox]{width:auto;margin-right:.4rem}
.seg{display:flex;gap:1.2rem}.seg label,.chk{font-weight:400;display:flex;align-items:center}
.tabs{display:flex;gap:.4rem;margin-bottom:.5rem}
.tab{flex:1;padding:.5rem;border:1px solid var(--line);background:var(--paper);border-radius:8px;cursor:pointer;font:inherit}
.tab.on{background:var(--sd);color:#fff;border-color:var(--sd)}
.hide{display:none!important}
.err{color:var(--bad);min-height:1.2rem;margin:.4rem 0}
.note{background:var(--sl);border-radius:8px;padding:.6rem .8rem;font-size:.9rem;color:var(--sdd)}
.steps{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-top:1rem}
.steps span{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:.25rem .8rem;font-size:.88rem}
.badge{display:inline-block;padding:.1rem .6rem;border-radius:999px;font-size:.8rem;font-weight:600;color:#fff}
.pending{background:var(--wa)}.prog{background:#3b7ea1}.solved{background:var(--ok)}
.meta{color:var(--mut);font-size:.85rem}
.resp{background:var(--sl);border-radius:8px;padding:.7rem .9rem;margin-top:.6rem}
.resp.none{background:#fbf3e3;color:#7a5410}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.7rem;margin-bottom:1rem}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:.8rem;text-align:center}
.stat b{display:block;font-size:1.6rem;color:var(--sdd)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:.6rem}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:.8rem}
th,td{text-align:left;padding:.5rem;border-bottom:1px solid var(--line)}
th{background:var(--sl);color:var(--sdd)}
img.th{max-width:100%;max-height:220px;border-radius:8px;margin-top:.5rem;border:1px solid var(--line)}
dialog{border:0;border-radius:14px;max-width:560px;width:92%;padding:1.3rem}
dialog::backdrop{background:rgba(21,20,87,.4)}
footer{text-align:center;color:var(--mut);font-size:.82rem;padding:1rem}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:.3rem}
@media(max-width:600px){.filters{grid-template-columns:1fr}}
.guest aside,.guest .burger{display:none!important}
.guest main{padding-top:1.5rem!important}
#gbar{display:none;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;padding:.7rem 1.2rem;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.guest #gbar{display:flex}

.land .split{justify-content:flex-start}.land .split .txt{max-width:560px}
.land h1,.land p.lead,.land .meta{color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6),0 0 2px rgba(0,0,0,.4)}
.land h1 span{color:#ffb84d}
.land .quote{background:rgba(255,243,209,.96);margin-top:1.6rem}
.land>*{position:relative}
.land h1{font-size:clamp(1.8rem,5vw,2.9rem);line-height:1.15;margin:.6rem 0}
.land h1 span{color:var(--sd)}
.land p.lead{color:var(--mut);max-width:580px;margin:.4rem auto 1rem;font-size:1.05rem}
.pill{display:inline-block;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:.3rem .9rem;font-size:.85rem;color:var(--sdd);font-weight:600}
.blob{position:absolute!important;border-radius:50%;background:var(--sage);opacity:.2;animation:fl 7s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-20px)}}
.pop{animation:up .6s both}@keyframes up{from{opacity:0;transform:translateY(14px)}}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.9rem;margin:1rem 0 1.4rem}
.feat div{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:1.1rem;transition:.2s}
.feat div:hover{transform:translateY(-4px);box-shadow:0 8px 18px rgba(21,20,87,.14)}
.feat i{font-style:normal;font-size:1.9rem;display:block;margin-bottom:.3rem}
.feat b{color:var(--sdd)}.feat p{margin:.2rem 0 0;color:var(--mut);font-size:.9rem}
.flow{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;margin:1rem 0}
.flow div{text-align:center;width:120px}
.flow b{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--sd);color:#fff;margin:0 auto .3rem}
.band{background:var(--sdd);color:#fff;border-radius:18px;padding:1.6rem;text-align:center}
.band h2{color:#fff}
.hello{font-size:1.7rem}
.warn{background:#fff4d6;border:1px solid #e3c36b;border-left:6px solid var(--wa);border-radius:12px;padding:.9rem 1.1rem;margin-bottom:1rem;color:#6b4a0c}
.warn b.id{display:inline-block;background:var(--paper);border:1px dashed var(--wa);border-radius:8px;padding:.1rem .6rem;font-size:1.05rem;letter-spacing:.05em;color:var(--ink)}
.split{display:flex;flex-wrap:wrap;align-items:center;gap:1.6rem;text-align:left}
.split .txt{flex:1 1 300px}
.split .pic{flex:1 1 280px;max-width:420px;position:relative;margin:0 auto}
.split .pic>img:first-child{width:100%;display:block;border-radius:18px;border:5px solid #fff;box-shadow:0 10px 24px rgba(21,20,87,.22)}
.badge-logo{position:absolute;width:86px;right:-10px;bottom:-20px;background:#fff;border-radius:50%;padding:6px;box-shadow:0 6px 14px rgba(21,20,87,.25)}
.land h1 span{background:linear-gradient(transparent 62%,rgba(255,154,0,.45) 0);padding:0 .15em}
.fac div{border-top:4px solid var(--or)}
.addr{opacity:.85;font-size:.9rem;margin-top:.6rem}

input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
aside img,#gbar img,.card.narrow img{mix-blend-mode:multiply}
.stat{border-bottom:3px solid var(--gold)}

 ['🎉','Activities Area','School events, programs, and celebrations.']
];
const CATS  = ['Facilities','Academic','Behavioral','Student Support'];
const TYPES = ['Feedback','Complaint','Request for Assistance'];
const STATUS = {'Pending':'pending','In Progress':'prog','Solved':'solved'};
const QUOTES = [
 'Small steps every day still take you far.',
 'Your voice matters. Speaking up is a sign of strength.',
 'Mistakes are proof that you are trying. Keep going.',
 'You do not have to be perfect to be proud of your progress.',
 'Hard days build strong people. You are doing better than you think.',

 'Believe in the effort you put in today. It shapes your tomorrow.',
 'Every expert was once a beginner. Keep learning.'
];

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
const all = () => { const l = load('sfs_concerns'); if (!Array.isArray(l)) return []; const seen = new Set();
  return l.filter(c => c && typeof c === 'object').map((c, i) => { const d = c.date || new Date().toISOString();
    let ref = c.ref || ('SFS-' + d.slice(0, 10).replace(/-/g, '') + '-L' + String(i + 1).padStart(3, '0')), base = ref, n = 2;
    while (seen.has(ref)) ref = base + '-' + n++; seen.add(ref);
    return { subject: '', desc: '', cat: '', type: '', reply: '', ...c, ref, date: d, status: STATUS[c.status] ? c.status : 'Pending' }; }); };
const fmt = d => new Date(d).toLocaleString('en-PH', { dateStyle: 'medium', timeStyle: 'short' });
const badge = s => `<span class="badge ${STATUS[s]}">${esc(s)}</span>`;
const back = () => `<div class="row"><button class="btn ghost" data-go="home">← Back to Home</button></div>`;
const opts = (arr, first) => (first ? `<option value="">${first}</option>` : '') + arr.map(a => `<option>${esc(a)}</option>`).join('');
const normName = n => String(n || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
const aliases = () => load('sfs_alias') || {};
const usedAnon = () => new Set([...Object.values(aliases()), ...all().map(c => c.owner).filter(o => /^ANON-/.test(o))]);
const newAnonId = () => { const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', used = usedAnon(); let id; do { id = 'ANON-'; for (let i = 0; i < 6; i++) id += c[Math.floor(Math.random() * c.length)]; } while (used.has(id)); return id; };
const aliasFor = sid => { const a = aliases(); if (!a[sid]) { a[sid] = newAnonId(); save('sfs_alias', a); } return a[sid]; };
const anonIdOf = c => c.anonId || (/^ANON-/.test(c.owner) ? c.owner : (c.anon && c.owner ? aliasFor(c.owner) : ''));
const students = () => load('sfs_students') || {};
const shrink = f => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => { const i = new Image(); i.onload = () => {
    const s = Math.min(1, 700 / Math.max(i.width, i.height)), c = document.createElement('canvas');
    c.width = i.width * s; c.height = i.height * s; c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
    res(c.toDataURL('image/jpeg', .7)); }; i.onerror = rej; i.src = r.result; };
  r.onerror = rej; r.readAsDataURL(f);
});

let session = load('sfs_session');
let view = 'home';
let quote = QUOTES[Math.floor(Math.random() * QUOTES.length)];

/* ================= NAVIGATION ================= */
function go(v, note) {
  if (session && (v === 'login' || v === 'staff')) v = 'home';
  if ((v === 'submit' || v === 'mine') && session?.role !== 'student') { v = 'login'; note = 'Please log in as a student first.'; }
  if (v === 'records' && session?.role !== 'staff') { v = 'staff'; note = 'Records are for authorized staff only.'; }
  view = v; drawNav();
  ({ home: pHome, login: n => pLogin(n, 's'), staff: n => pLogin(n, 'f'), submit: pSubmit, mine: pMine, records: pRecords, about: pAbout })[v](note);
  if (session?.anon && v !== 'login' && v !== 'staff') app.insertAdjacentHTML('afterbegin', anonWarn());
  const cp = $('#cpid'); if (cp) cp.onclick = () => { try { navigator.clipboard.writeText(session.id); cp.textContent = 'Copied ✓'; } catch (e) { cp.textContent = 'Select and copy manually'; } };
  $('#side').classList.remove('open'); window.scrollTo(0, 0);
}
const anonWarn = () => `<div class="warn"><b>⚠️ Important: keep your Anonymous ID!</b><br>
  Your ID is <b class="id">${esc(session.id)}</b> <button class="btn small ghost" id="cpid" type="button">Copy</button><br>
  You need this ID (plus the password) to log in again and <b>track the status and staff response</b> of your concerns. Because you are anonymous, we don't store your name or email, so <b>we cannot recover a lost ID</b>. Write it down or take a screenshot now.</div>`;
function drawNav() {
  document.body.classList.toggle('guest', !session);
  if (!session) { $('#nav').innerHTML = ''; return; }
  const it = (k, i, l) => `<button class="${view === k ? 'on' : ''}" data-go="${k}"><i>${i}</i>${l}</button>`;
  let h = '<div class="lbl">MAIN MENU</div>' + it('home', '⌂', 'Overview');
  if (session.role === 'student') h += it('submit', '✎', 'Submit Feedback') + it('mine', '⌕', 'Track Status');
  else h += it('records', '▤', 'Records');
  h += it('about', 'ⓘ', 'About System');
  h += '<div class="lbl" style="margin-top:1rem">ACCOUNT</div><button id="lo"><i>⎋</i>Logout</button>';
  $('#nav').innerHTML = h;
  $('#lo').onclick = logout;
}
function logout() { session = null; try { localStorage.removeItem('sfs_session'); } catch (e) {} go('home'); }
$('#bg').onclick = () => $('#side').classList.toggle('open');
document.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); });

/* ================= HOME ================= */
function quoteCard() { return `<div class="quote" id="q">“${esc(quote)}”</div><div class="row"><button class="btn small ghost" id="nq">Show another quote</button></div>`; }
function bindQuote() { $('#nq').onclick = () => { quote = QUOTES[Math.floor(Math.random() * QUOTES.length)]; $('#q').textContent = '“' + quote + '”'; }; }
const facCards = () => `<div class="feat fac">${FACILITIES.map(f => `<div><i>${f[0]}</i><b>${esc(f[1])}</b><p>${esc(f[2])}</p></div>`).join('')}</div>`;
function pHome() {
  if (!session) {
    app.innerHTML = `<div class="land pop">
      <div class="blob" style="width:160px;height:160px;top:-40px;left:-40px"></div><div class="blob" style="width:110px;height:110px;bottom:20px;right:6%;animation-delay:-3s;background:var(--or)"></div>
      <div class="split"><div class="txt">
        <span class="pill">🏫 Lemery Colleges • Est. 1994</span>
        <h1>Welcome, <span>Lcians!</span></h1>
        <p class="lead" style="margin-left:0">Your voice matters. Share your feedback, report a concern, or ask for support. Then watch its progress and read the staff's reply, all in one friendly place.</p>
        <div class="row" style="justify-content:flex-start"><button class="btn" data-go="login">🎓 Student Login</button><button class="btn ghost" data-go="staff">🛡️ Staff Portal</button></div>
        <p class="meta" style="margin-top:.8rem">Prefer privacy? Log in with just an Anonymous ID. No personal details needed.</p></div></div>
      ${quoteCard()}</div>
    <div class="card"><h2 style="text-align:center">How it works</h2><div class="flow">
      <div><b>1</b>Submit<br><span class="meta">Fill in the form</span></div><div><b>2</b>Record<br><span class="meta">System saves it</span></div>
      <div><b>3</b>Review<br><span class="meta">Staff checks it</span></div><div><b>4</b>Respond<br><span class="meta">Reply and status</span></div>
      <div><b>5</b>Follow up<br><span class="meta">You see updates</span></div></div></div>
    <div class="band"><h2>Ready to be heard, Lcian?</h2><p>Every submission helps us improve.</p>
      <div class="row"><button class="btn ghost" data-go="login">Get Started</button><button class="btn ghost" data-go="about">Learn More</button></div>
      <p class="addr">📍 A. Bonifacio St., Brgy. Bagong Sikat, Lemery, Batangas</p></div>`;
    return bindQuote();
  }
  const st = session.role === 'staff' ? all() : all().filter(c => c.owner === session.id), n = s => st.filter(c => c.status === s).length;
  const who = session.anon ? 'Anonymous Student' : (session.name || session.id), staff = session.role === 'staff';
  app.innerHTML = `<div class="card hero pop${staff ? '' : ' herobg'}"><img src="${LOGO}" alt="" width="72"><h1 class="hello">${staff ? 'Hello, ' + esc(who) + '! 👋' : 'Welcome, Lcians! 👋'}</h1>
    <p>${staff ? 'Here is a quick look at the concerns of your students.' : 'Hi, ' + esc(who) + '! Here is where your concerns stand.'}</p>
    <div class="grid"><div class="stat"><b>${st.length}</b>Total</div><div class="stat"><b>${n('Pending')}</b>Pending</div><div class="stat"><b>${n('In Progress')}</b>In Progress</div><div class="stat"><b>${n('Solved')}</b>Solved</div></div>
    ${quoteCard()}
    <div class="row">${staff ? '<button class="btn" data-go="records">Open Records</button>' : '<button class="btn" data-go="submit">✎ Submit Feedback</button><button class="btn ghost" data-go="mine">⌕ Track Status</button>'}</div></div>
    <h2>Around Lemery Colleges</h2>${facCards()}`;
  bindQuote();
}

/* ================= LOGIN ================= */
function pLogin(note, tab) {
  app.innerHTML = `<div class="card narrow pop"><div style="text-align:center"><img src="${LOGO}" alt="" width="76"></div><h2 style="text-align:center">${tab === 'f' ? '🛡️ Staff Portal' : '🎓 Welcome, Lcian! 👋'}</h2>
    ${note ? `<p class="note">${esc(note)}</p>` : ''}
    <form id="fs" novalidate class="${tab === 'f' ? 'hide' : ''}">
      <div class="seg"><label><input type="radio" name="m" value="id" checked>With my details</label><label><input type="radio" name="m" value="anon">Anonymous</label></div>
      <div id="g1"><label for="nm">Full name</label><input id="nm" autocomplete="off" placeholder="Juan Dela Cruz">
        <label for="uid">Student ID</label><input id="uid" autocomplete="off" placeholder="e.g. 2024-00123">
        <label for="em">Email address</label><input id="em" type="email" autocomplete="off" placeholder="you@email.com"></div>
      <div id="g2" class="hide"><p class="meta">Only your Anonymous ID is used. No name, email, or personal details needed. Save your ID so you can log in again.</p>
        <label for="aid">Anonymous ID</label><input id="aid" autocomplete="off" placeholder="ANON-XXXXXX">
        <p><button type="button" class="btn small ghost" id="genb">Generate new Anonymous ID</button></p></div>
      <label for="pw">Password</label><input id="pw" type="password" autocomplete="off">
      <p class="err" id="err"></p>
      <div class="stack"><button class="btn">Login</button></div>
      <p class="note" style="text-align:center;margin-top:1rem">🔑 Student password: <b>${STUDENT_PASSWORD}</b></p>
    </form>
    <form id="ff" class="${tab === 'f' ? '' : 'hide'}">
      <label for="su">Staff username</label><input id="su" required autocomplete="off">
      <label for="sp">Password</label><input id="sp" type="password" required autocomplete="off">
      <p class="err" id="err2"></p>
      <div class="stack"><button class="btn">Login as Staff</button></div>
    </form>
    <p class="meta" style="text-align:center;margin-top:1rem">${tab === 'f' ? 'Not staff?<br><button type="button" class="btn small ghost" data-go="login">🎓 Go to Student Login</button>' : 'Are you staff?<br><button type="button" class="btn small ghost" data-go="staff">🛡️ Go to Staff Portal</button>'}</p>
    ${back()}</div>`;
  const anon = () => document.querySelector('[name=m]:checked').value === 'anon';
  document.querySelectorAll('[name=m]').forEach(r => r.onchange = () => { $('#g1').classList.toggle('hide', anon()); $('#g2').classList.toggle('hide', !anon()); $('#err').textContent = ''; });
  $('#genb').onclick = () => { $('#aid').value = newAnonId(); };
  $('#fs').onsubmit = e => {
    e.preventDefault(); const E = m => $('#err').textContent = m;
    let s;
    if (anon()) {
      const id = $('#aid').value.trim().toUpperCase();
      if (!/^ANON-[A-Z0-9]{6}$/.test(id)) return E('Invalid Anonymous ID. Use the format ANON-XXXXXX or generate a new one.');
      s = { role: 'student', id, anon: true };
    } else {
      const name = $('#nm').value.trim(), id = $('#uid').value.trim().toUpperCase(), email = $('#em').value.trim();
      if (!name || !id || !email) return E('Please fill in your name, Student ID, and email.');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return E('Please enter a valid email address.');
      const reg = students(), me = reg[id], emailKey = email.toLowerCase();
      if (me && normName(me.name) !== normName(name)) return E('This Student ID is already registered under a different name. Please check your Student ID or name.');
      const other = Object.keys(reg).find(k => k !== id && (reg[k].email || '').toLowerCase() === emailKey);
      if (other) return E('That email is already used by another Student ID. Please use your own email.');
      s = { role: 'student', id, anon: false, name: me ? me.name : name, email };
    }
    if ($('#pw').value !== STUDENT_PASSWORD) return E('Wrong password.');
    if (!s.anon) { const reg = students(); reg[s.id] = { name: s.name, email: s.email }; save('sfs_students', reg); }
    start(s);
  };
  $('#ff').onsubmit = e => {
    e.preventDefault();
    if ($('#su').value.trim() !== STAFF.user || $('#sp').value !== STAFF.pw) return $('#err2').textContent = 'Wrong username or password.';
    start({ role: 'staff', id: STAFF.user });
  };
}
function start(s) { session = s; save('sfs_session', s); go(s.role === 'staff' ? 'records' : 'home'); }

/* ================= SUBMIT CONCERN ================= */
function pSubmit() {
  app.innerHTML = `<div class="card"><h2>Submit Feedback</h2>
    <form id="f">
      <label>Type</label><select id="ty" required>${opts(TYPES)}</select>
      <label>Category</label><select id="ct" required>${opts(CATS, 'Select category')}</select>
      <label>Subject</label><input id="sj" required maxlength="100">
      <label>Details</label><textarea id="ds" rows="5" required maxlength="2000"></textarea>
      <label>Image (optional, up to 5 MB)</label><input id="im" type="file" accept="image/*">
      <label class="chk"><input type="checkbox" id="an" ${session.anon ? 'checked disabled' : ''}>Submit anonymously ${session.anon ? '(you are logged in with an Anonymous ID)' : ''}</label>
      <p class="err" id="err"></p>
      <div class="stack"><button class="btn">Submit Concern</button>
      <button type="button" class="btn ghost" data-go="home">← Back to Home</button></div>
    </form></div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const file = $('#im').files[0]; let img = '';
    if (file) {
      if (file.size > 5 * 1024 * 1024) return $('#err').textContent = 'Image is larger than 5 MB.';
      try { img = await shrink(file); } catch (x) { return $('#err').textContent = 'Could not read that image.'; }
    }
    const now = new Date(), list = all(), day = 'SFS-' + now.toISOString().slice(0, 10).replace(/-/g, '') + '-';
    let ref; do { ref = day + Math.floor(1000 + Math.random() * 9000); } while (list.some(x => x.ref === ref));
    list.push({ ref, owner: session.id, name: session.name || '', email: session.email || '', anon: session.anon || $('#an').checked, anonId: (session.anon || $('#an').checked) ? (session.anon ? session.id : aliasFor(session.id)) : '', type: $('#ty').value, cat: $('#ct').value,
      subject: $('#sj').value.trim(), desc: $('#ds').value.trim(), img, date: now.toISOString(), status: 'Pending', reply: '', replyDate: '' });
    if (!save('sfs_concerns', list)) return $('#err').textContent = 'Storage is full. Try a smaller image or no image.';
    app.innerHTML = `<div class="card narrow" style="text-align:center"><h2>✅ Concern submitted</h2>
      <p>Your reference number:</p><h3>${esc(ref)}</h3>
      ${session.anon ? `<p class="note">⚠️ Remember: keep your Anonymous ID <b>${esc(session.id)}</b>. You need it to track this concern.</p>` : ''}<p class="meta">Keep this number. You can check the status and staff response under “Track Status”.</p>
      <div class="stack"><button class="btn" data-go="mine">Track Status</button>
      <button class="btn ghost" data-go="home">← Back to Home</button></div></div>`;
  };
}

/* ================= MY CONCERNS (student) ================= */
function pMine() {
  const mine = all().filter(c => c.owner === session.id).reverse();
  app.innerHTML = `<h2>Track Status</h2>` + (mine.length ? mine.map(c => `<div class="card">
    <div class="meta">${esc(c.ref)} • ${fmt(c.date)} • ${esc(c.cat)} • ${esc(c.type)}${c.anon ? ' • Anonymous' : ''}</div>
    <h3>${esc(c.subject)} ${badge(c.status)}</h3>
    <p>${esc(c.desc)}</p>${c.img ? `<img class="th" src="${c.img}" alt="Attachment">` : ''}
    ${c.reply
      ? `<div class="resp"><b>Staff response</b> <span class="meta">(${fmt(c.replyDate)})</span><br>${esc(c.reply)}</div>`
      : `<div class="resp none"><b>No response yet.</b> ${c.status === 'Pending' ? 'Status: Pending. Waiting for staff review.' : 'Status: ' + esc(c.status) + '. Staff has not posted a reply yet.'}</div>`}
  </div>`).join('') : `<div class="card"><p>You have no submitted concerns yet.</p></div>`) +
  `<div class="row"><button class="btn" data-go="submit">Submit a Concern</button></div>` + back();
}

/* ================= RECORDS (staff only) ================= */
function dupNames() {
  const m = {}, add = (n, id) => { const k = normName(n); if (k) (m[k] = m[k] || new Set()).add(id); };
  const reg = students(); Object.keys(reg).forEach(id => add(reg[id].name, id));
  all().forEach(c => { if (!c.anon && c.name) add(c.name, c.owner); });
  return m;
}
function fromCell(c) {
  if (c.anon) return '<i>Anonymous</i>';
  const d = dupNames()[normName(c.name)], dup = d && d.size > 1;
  return (esc(c.name || '') || '<i>Unknown</i>') + (c.owner ? '<br><small class="meta">ID: ' + esc(c.owner) + '</small>' : '') +
    (dup ? '<br><small class="dupflag" title="Another student has the same name. Check the Student ID.">⚠ Same name</small>' : '');
}
function pRecords() {
  const list = all(), cnt = s => list.filter(c => c.status === s).length;
  const months = {}; list.forEach(c => { const m = c.date.slice(0, 7); months[m] = (months[m] || 0) + 1; });
  app.innerHTML = `<h2>Records</h2>
    <div class="grid"><div class="stat"><b>${list.length}</b>Total</div><div class="stat"><b>${cnt('Pending')}</b>Pending</div>
      <div class="stat"><b>${cnt('In Progress')}</b>In Progress</div><div class="stat"><b>${cnt('Solved')}</b>Solved</div></div>
    <p class="meta">Monthly totals: ${Object.keys(months).sort().map(m => `${m}: <b>${months[m]}</b>`).join(' • ') || 'none yet'}</p>
    <div class="card"><div class="filters">
      <input id="fq" placeholder="Search reference, subject, details…">
      <select id="fst">${opts(Object.keys(STATUS), 'All status')}</select>
      <select id="fc">${opts(CATS, 'All categories')}</select></div>
      <div class="tw"><table><thead><tr><th>Ref</th><th>Date</th><th>From</th><th>Anonymous ID</th><th>Category</th><th>Subject</th><th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div>
    <div class="row"><button class="btn ghost" id="exp">Download CSV</button></div>` + back();
  const rows = () => { const q = $('#fq').value.toLowerCase(), s = $('#fst').value, c = $('#fc').value;
    return all().filter(x => (!s || x.status === s) && (!c || x.cat === c) && (!q || (x.ref + x.subject + x.desc + (x.anon ? '' : x.name + x.owner) + anonIdOf(x)).toLowerCase().includes(q))).reverse(); };
  const draw = () => { const r = rows(); $('#tb').innerHTML = r.length ? r.map(c => `<tr><td>${esc(c.ref)}</td><td>${fmt(c.date)}</td>
    <td>${fromCell(c)}</td><td>${anonIdOf(c) ? '<code>' + esc(anonIdOf(c)) + '</code>' : '—'}</td><td>${esc(c.cat) || '—'}</td><td>${esc(c.subject)}</td><td>${badge(c.status)}</td>
    <td><button class="btn small" data-v="${esc(c.ref)}">Open</button></td></tr>`).join('') : '<tr><td colspan="8">No records found.</td></tr>'; };
  ['fq', 'fst', 'fc'].forEach(i => $('#' + i).oninput = draw); draw();
  $('#tb').onclick = e => { const b = e.target.closest('[data-v]'); if (b) openRec(b.dataset.v, draw); };
  $('#exp').onclick = () => {
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const csv = ['Ref,Date,From,Student ID,Anonymous ID,Type,Category,Subject,Details,Status,Reply'].concat(all().map(c =>
      [c.ref, c.date, c.anon ? 'Anonymous' : (c.name || '') + ' | ' + (c.email || ''), c.anon ? '' : c.owner, anonIdOf(c), c.type, c.cat, c.subject, c.desc, c.status, c.reply].map(q).join(','))).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'concerns.csv'; a.click();
  };
}
function openRec(ref, redraw) {
  const c = all().find(x => x.ref === ref), d = $('#dlg'); if (!c) return;
  d.innerHTML = `<div class="meta">${esc(c.ref)} • ${fmt(c.date)} • ${esc(c.cat)} • ${esc(c.type)}</div>
    <h3>${esc(c.subject)}</h3><p class="meta">From: ${c.anon ? 'Anonymous • Anonymous ID: <b>' + esc(anonIdOf(c)) + '</b>' : esc(c.name || '') + ' • Student ID: ' + esc(c.owner) + ' • ' + esc(c.email || '')}</p><p>${esc(c.desc)}</p>
    ${c.img ? `<img class="th" src="${c.img}" alt="Attachment">` : ''}
    <label>Status</label><select id="ns">${opts(Object.keys(STATUS))}</select>
    <label>Staff response</label><textarea id="nr" rows="4" maxlength="1500">${esc(c.reply)}</textarea>
    <div class="row"><button class="btn" id="sv">Save</button><button class="btn ghost" id="cl">Close</button></div>`;
  $('#ns').value = c.status;
  $('#cl').onclick = () => d.close();
  $('#sv').onclick = () => {
    const list = all(), x = list.find(y => y.ref === ref), r = $('#nr').value.trim();
    x.status = $('#ns').value;
    if (r && r !== x.reply) { x.reply = r; x.replyDate = new Date().toISOString(); if (x.status === 'Pending') x.status = 'In Progress'; }
    save('sfs_concerns', list); d.close(); pRecords();
  };
  d.showModal();
}

/* ================= ABOUT ================= */
function pAbout() {
  app.innerHTML = `<div class="card"><img class="th" src="${CAMPUS}" alt="Lemery Colleges" style="float:right;max-width:240px;margin:0 0 .6rem 1rem"><h2>About the System</h2><p class="meta">Made for Lemery Colleges • A. Bonifacio St., Brgy. Bagong Sikat, Lemery, Batangas</p>
    <p>A web-based platform for collecting, organizing, and monitoring student feedback and support requests.</p>
    <h3>How it works</h3><div class="steps" style="justify-content:flex-start"><span>1 Submit</span><span>2 Record</span><span>3 Review</span><span>4 Respond</span><span>5 Follow up</span></div>
    <h3 style="margin-top:1rem">Status meanings</h3>
    <p>${badge('Pending')} Submitted; awaiting review.<br>${badge('In Progress')} Being reviewed or addressed.<br>${badge('Solved')} Marked as addressed by staff.</p>
    <h3>Privacy</h3><p>Anonymous users log in with an Anonymous ID only. Staff cannot see their identity. Anonymity is not guaranteed to be absolute.</p>
    <h3>Limitations</h3><p class="meta">No real-time chat • Web-based only • No AI auto-response • Enrolled students only • Images up to 5 MB • No financial transactions</p>
    ${session?.role === 'staff' ? '' : `
    <h2 style="text-align:center;margin-top:1.6rem">Explore Lemery Colleges</h2>
    <p class="meta" style="text-align:center">A look at what makes campus life special for every Lcian.</p>
    ${facCards()}
    <h2 style="text-align:center;margin-top:1.4rem">Everything you need in one place</h2>
    <div class="feat">
      <div><i>✍️</i><b>Submit Concerns</b><p>Feedback, complaints, or requests for help, sent in minutes.</p></div>
      <div><i>🕶️</i><b>Anonymous Option</b><p>Use an Anonymous ID so you don't have to share personal details.</p></div>
      <div><i>🔎</i><b>Track Status</b><p>See if your concern is Pending, In Progress, or Solved.</p></div>
      <div><i>💬</i><b>Staff Replies</b><p>Read the response of the guidance staff right on your page.</p></div>
      <div><i>🗂️</i><b>Organized Records</b><p>Concerns are saved neatly so nothing gets lost or overlooked.</p></div>
      <div><i>📴</i><b>Works Offline</b><p>Keeps running even when your internet connection drops.</p></div></div>
    `}
    ${back()}</div>`;
}

/* ================= OFFLINE INDICATOR + START ================= */
function net() { const on = navigator.onLine; $('#dot').style.background = on ? 'var(--ok)' : 'var(--wa)'; $('#net').textContent = on ? 'Offline-ready' : 'Offline mode (still working)'; }
document.querySelectorAll('.lg').forEach(i => i.src = LOGO);
const fav = document.createElement('link'); fav.rel = 'icon'; fav.href = LOGO; document.head.appendChild(fav);
addEventListener('online', net); addEventListener('offline', net); net();
go('home');
</script>
</body>
</html>
